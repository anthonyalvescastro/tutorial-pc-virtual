name: PC Virtual @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string
      restore_backup:
        description: 'Restaurar backup anterior?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      session_hours:
        description: 'Horas de sessao (1-6)'
        required: true
        default: '6'
        type: string

permissions:
  contents: write

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      shell: pwsh
      run: |
        Write-Host "=== PC VIRTUAL DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Restore Backup: ${{ github.event.inputs.restore_backup }}" -ForegroundColor Yellow
        Write-Host "Session Hours: ${{ github.event.inputs.session_hours }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Cyan
        Write-Host ""
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
        Get-WmiObject Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

    - name: Apply Performance Tweaks
      shell: pwsh
      run: |
        Write-Host "Aplicando tweaks de desempenho..." -ForegroundColor Cyan

        powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

        Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value 0 -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "DragFullWindows" -Value 0 -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "MenuShowDelay" -Value 0 -ErrorAction SilentlyContinue

        New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Force -ErrorAction SilentlyContinue | Out-Null
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Name "NoChangingWallPaper" -Value 1 -Force -ErrorAction SilentlyContinue

        New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force -ErrorAction SilentlyContinue | Out-Null
        New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "fNoRemoteDesktopWallpaper" -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue
        New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "SelectTransport" -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue
        New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "MaxMonitors" -Value 4 -PropertyType DWord -Force -ErrorAction SilentlyContinue

        Write-Host "Tweaks aplicados." -ForegroundColor Green

    - name: Optimize Network
      shell: pwsh
      run: |
        Write-Host "Otimizando rede..." -ForegroundColor Cyan

        New-NetFirewallRule -DisplayName "Tailscale UDP" -Direction Inbound -Protocol UDP -LocalPort 41641 -Action Allow -ErrorAction SilentlyContinue | Out-Null
        New-NetFirewallRule -DisplayName "Tailscale TCP" -Direction Inbound -Protocol TCP -LocalPort 41641 -Action Allow -ErrorAction SilentlyContinue | Out-Null

        netsh int tcp set global rsc=enabled 2>$null
        netsh int tcp set global autotuninglevel=normal 2>$null

        $ifs = Get-ChildItem "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces"
        foreach ($i in $ifs) {
          New-ItemProperty -Path $i.PSPath -Name "TcpAckFrequency" -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
          New-ItemProperty -Path $i.PSPath -Name "TCPNoDelay" -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue | Out-Null
        }

        Write-Host "Rede otimizada." -ForegroundColor Green

    - name: Restore Backup
      if: ${{ github.event.inputs.restore_backup == 'yes' }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        Write-Host "Procurando backup..." -ForegroundColor Cyan
        $latest = gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null
        if ([string]::IsNullOrWhiteSpace($latest)) {
          Write-Host "Nenhum backup encontrado." -ForegroundColor Yellow
          exit 0
        }
        Write-Host "Restaurando: $latest" -ForegroundColor Green
        $dir = "$env:TEMP\restore"
        if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
        gh release download $latest --pattern "backup.zip" --dir $dir --clobber
        if (-not (Test-Path "$dir\backup.zip")) { exit 0 }
        Expand-Archive -Path "$dir\backup.zip" -DestinationPath $dir -Force

        $mapa = @("Backup","Desktop","Documents","Downloads","Pictures","Videos","Music")
        foreach ($p in $mapa) {
          $origem = "$dir\$p"
          if (Test-Path $origem) {
            $destino = "$env:USERPROFILE\$p"
            New-Item -ItemType Directory -Force -Path $destino | Out-Null
            Copy-Item -Path "$origem\*" -Destination $destino -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  Restaurado: $p" -ForegroundColor Green
          }
        }

        $info = "$env:USERPROFILE\Backup\.wallpaper-info.txt"
        if (Test-Path $info) {
          $wallpaper = (Get-Content $info -Raw).Trim()
          if (Test-Path $wallpaper) {
            Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "WallPaper" -Value $wallpaper -Force -ErrorAction SilentlyContinue
            rundll32.exe user32.dll,UpdatePerUserSystemParameters 2>$null
            Write-Host "  Wallpaper restaurado: $wallpaper" -ForegroundColor Green
          }
        }

    - name: Enable RDP
      shell: pwsh
      run: |
        Write-Host "Habilitando RDP..." -ForegroundColor Green
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "PortNumber" -Value 3389
        Restart-Service TermService -Force
        Write-Host "RDP ativo na porta 3389." -ForegroundColor Green

    - name: Create User Account
      shell: pwsh
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        RDP_USER: ${{ secrets.RDP_USER }}
      run: |
        Write-Host "Criando usuario..." -ForegroundColor Green
        $user = if ($env:RDP_USER) { $env:RDP_USER } else { "pcuser" }
        $pass = if ($env:RDP_PASSWORD) { $env:RDP_PASSWORD } else { "P@ssw0rd!2024" }
        $sec = ConvertTo-SecureString $pass -AsPlainText -Force

        if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
          Set-LocalUser -Name $user -Password $sec
        } else {
          New-LocalUser -Name $user -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
        }
        Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
        Write-Host "Usuario '$user' criado." -ForegroundColor Green

    - name: Install Tailscale
      shell: pwsh
      run: |
        Write-Host "Baixando Tailscale..." -ForegroundColor Green
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\ts.msi"
        Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\ts.msi`" /quiet /norestart" -Wait
        Remove-Item "$env:TEMP\ts.msi" -Force
        Write-Host "Tailscale instalado." -ForegroundColor Green

    - name: Start Tailscale
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
        hostname: enigmano-${{ github.event.inputs.instance_number }}-${{ github.run_id }}
        args: --accept-routes --accept-dns=false --netfilter-mode=off

    - name: Get Tailscale IP
      shell: pwsh
      run: |
        Write-Host "`n=== STATUS TAILSCALE ===" -ForegroundColor Cyan
        & "C:\Program Files\Tailscale\tailscale.exe" status
        $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
        Write-Host "IP Tailscale: $ip" -ForegroundColor Green

    - name: Install Applications
      shell: pwsh
      run: |
        Write-Host "Instalando apps..." -ForegroundColor Green

        $apps = @(
          @{ name="Chrome";    url="https://dl.google.com/chrome/install/latest/chrome_installer.exe"; args="/silent /install" },
          @{ name="7-Zip";     url="https://www.7-zip.org/a/7z2409-x64.exe";                           args="/S" },
          @{ name="VLC";       url="https://get.videolan.org/vlc/last/win64/vlc-3.0.21-win64.exe";     args="/L=1033 /S" },
          @{ name="Notepad++"; url="https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.7/npp.8.7.Installer.x64.exe"; args="/S" }
        )

        foreach ($app in $apps) {
          Write-Host "Baixando $($app.name)..." -ForegroundColor Cyan
          $path = "$env:TEMP\$($app.name).exe"
          try {
            Invoke-WebRequest -Uri $app.url -OutFile $path -UseBasicParsing
            Start-Process -FilePath $path -ArgumentList $app.args -Wait
            Remove-Item $path -Force
            Write-Host "$($app.name) instalado." -ForegroundColor Green
          } catch {
            Write-Host "Falha ao instalar $($app.name): $_" -ForegroundColor Red
          }
        }

    - name: Connection Details
      shell: pwsh
      run: |
        Write-Host ""
        Write-Host "==================================================" -ForegroundColor Cyan
        Write-Host "             PC VIRTUAL - ACESSO                  " -ForegroundColor Cyan
        Write-Host "==================================================" -ForegroundColor Cyan
        Write-Host " Host (Tailscale) : $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host " Porta RDP        : 3389" -ForegroundColor White
        Write-Host " Usuario          : pcuser" -ForegroundColor White
        Write-Host " Senha            : (definida em RDP_PASSWORD)" -ForegroundColor White
        Write-Host " Backup salva     : Desktop, Documents, Downloads, Pictures, etc." -ForegroundColor Yellow
        Write-Host " Backup roda      : a cada 5 minutos" -ForegroundColor Yellow
        Write-Host "==================================================" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "INSTRUCOES:" -ForegroundColor Yellow
        Write-Host " 1. Instale o Tailscale no seu aparelho" -ForegroundColor White
        Write-Host " 2. Faca login com a MESMA conta" -ForegroundColor White
        Write-Host " 3. Abra o Remote Desktop e conecte no IP acima" -ForegroundColor White
        Write-Host " 4. Backup automatico roda a cada 5 minutos" -ForegroundColor Yellow
        Write-Host " 5. Wallpaper salvo em: C:\Users\<user>\Backup\.wallpaper-info.txt" -ForegroundColor Yellow

    - name: Keep Session Alive
      shell: pwsh
      env:
        TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        INSTANCE: ${{ github.event.inputs.instance_number }}
        SESSION_HOURS: ${{ github.event.inputs.session_hours }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        Write-Host "`n=== SESSAO ATIVA ===" -ForegroundColor Green
        Write-Host "Backup automatico a cada 5 minutos." -ForegroundColor Yellow
        Write-Host "Salve arquivos em: Desktop, Documents ou Downloads" -ForegroundColor Yellow

        $pastas = @("Backup","Desktop","Documents","Downloads","Pictures","Videos","Music")
        $extsIgnorar = @(".crdownload", ".part", ".tmp", ".partial", ".download")

        function Save-WallpaperInfo {
          $info = "$env:USERPROFILE\Backup\.wallpaper-info.txt"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\Backup" | Out-Null
          try {
            $wallpaper = (Get-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name WallPaper -ErrorAction SilentlyContinue).WallPaper
            if ($wallpaper -and (Test-Path $wallpaper)) {
              Set-Content -Path $info -Value $wallpaper -Encoding UTF8
              Write-Host "  Wallpaper salvo: $wallpaper" -ForegroundColor DarkGray
            }
          } catch {
            Write-Host "  Nao foi possivel salvar info do wallpaper." -ForegroundColor DarkYellow
          }
        }

        function Save-Backup {
          $staging = "$env:TEMP\staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Save-WallpaperInfo

          $total = 0
          foreach ($p in $pastas) {
            $origem = "$env:USERPROFILE\$p"
            if (Test-Path $origem) {
              $destino = "$staging\$p"
              New-Item -ItemType Directory -Force -Path $destino | Out-Null

              Get-ChildItem -Path $origem -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $extsIgnorar -notcontains $_.Extension.ToLower() } |
                ForEach-Object {
                  $rel = $_.FullName.Substring($origem.Length).TrimStart("\")
                  $destFile = Join-Path $destino $rel
                  $destDir = Split-Path $destFile -Parent
                  if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir | Out-Null }
                  Copy-Item -Path $_.FullName -Destination $destFile -Force -ErrorAction SilentlyContinue
                  $total++
                }

              $c = (Get-ChildItem "$destino" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
              Write-Host "  $p : $c arquivos" -ForegroundColor DarkGray
            }
          }

          if ($total -eq 0) { Write-Host "  Nada para salvar." -ForegroundColor Yellow; return }

          $zip = "$env:TEMP\backup.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -Force -ErrorAction SilentlyContinue

          $sizeMB = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          if ($sizeMB -gt 1900) {
            Write-Host "  AVISO: ${sizeMB}MB excede limite de 2GB. Backup ignorado." -ForegroundColor Red
            Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
            return
          }

          $tag = "backup-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          gh release create $tag $zip --title "Backup $tag" --notes "$total arquivos, ${sizeMB}MB" --latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "  Backup OK: $tag ($total arquivos, $sizeMB MB)" -ForegroundColor Cyan
          } else {
            Write-Host "  Falha ao salvar backup." -ForegroundColor Red
          }
          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
        }

        $endTime = (Get-Date).AddHours([int]$env:SESSION_HOURS)
        $lastBackup = Get-Date
        $counter = 0

        while ((Get-Date) -lt $endTime) {
          $counter++
          $remaining = [math]::Round(($endTime - (Get-Date)).TotalMinutes)

          if (((Get-Date) - $lastBackup).TotalMinutes -ge 5) {
            Write-Host "`n[$(Get-Date -Format 'HH:mm:ss')] Backup periodico..." -ForegroundColor Yellow
            Save-Backup
            $lastBackup = Get-Date
          }

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $tsPath) {
            try {
              $status = & $tsPath status 2>&1
              if ($status -match "Logged out|stopped") { throw "off" }
            } catch {
              Write-Host "  Tailscale caiu. Status atual: $status" -ForegroundColor Yellow
            }
          }

          Write-Host "[$counter] $(Get-Date -Format 'HH:mm:ss') - Restam ${remaining}min" -ForegroundColor Green
          Start-Sleep -Seconds 60
        }

        Write-Host "`nSessao terminando. Backup final..." -ForegroundColor Yellow
        Save-Backup
        Write-Host "Sessao encerrada." -ForegroundColor Green
